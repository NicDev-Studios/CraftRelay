version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    ignore:
      # Paper 26.1+ requires Java 25; this project currently targets Java 21.
      - dependency-name: "io.papermc.paper:paper-api"
        versions: ["26.*"]
      - dependency-name: "com.velocitypowered:velocity-api"
        versions: ["4.*"]

    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
