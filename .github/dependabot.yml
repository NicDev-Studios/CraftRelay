version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"

    open-pull-requests-limit: 5

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

    ignore:
      # Paper updates are disabled because newer Paper lines require Java 25.
      - dependency-name: "io.papermc.paper:paper-api"
      # Velocity updates are disabled because the newer 4.x line is not supported here.
      - dependency-name: "com.velocitypowered:velocity-api"

    groups:
      gradle-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Dependabot's Actions parser currently rejects the metadata helper workflow.
    # Its action pins are maintained manually so Gradle PRs remain unblocked.
    exclude-paths:
      - ".github/workflows/dependabot-verification-metadata.yml"
    schedule:
      interval: "weekly"
