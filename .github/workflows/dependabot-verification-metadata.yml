name: Resolve Dependabot verification metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.jar
      - gradle/wrapper/gradle-wrapper.properties

permissions:
  contents: read

concurrency:
  group: dependabot-verification-resolve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      metadata_changed: ${{ steps.metadata.outputs.changed }}
    steps:
      - name: Check out Dependabot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify allowed Dependabot changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          while IFS= read -r file; do
            case "$file" in
              gradle/libs.versions.toml|gradle/wrapper/gradle-wrapper.jar|gradle/wrapper/gradle-wrapper.properties)
                ;;
              *)
                echo "Unexpected file in Dependabot Gradle PR: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate isolated dependency verification project
        env:
          SEED_PROJECT: ${{ runner.temp }}/dependency-verification-seed
        run: |
          set -euo pipefail
          python3 scripts/generate-dependency-verification-project.py "$SEED_PROJECT"
          ./gradlew -p "$SEED_PROJECT" resolveVerificationDependencies \
            --no-daemon --write-verification-metadata sha256

      - name: Prepare generated metadata artifact
        env:
          SEED_PROJECT: ${{ runner.temp }}/dependency-verification-seed
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- || {
            echo "Dependency resolution modified the checked-out Dependabot revision." >&2
            git status --short >&2
            exit 1
          }
          python3 - "$SEED_PROJECT/gradle/verification-metadata.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          PY
          mkdir -p "$RUNNER_TEMP/dependency-verification-artifact"
          cp "$SEED_PROJECT/gradle/verification-metadata.xml" \
            "$RUNNER_TEMP/dependency-verification-artifact/verification-metadata.xml"

      - name: Upload dependency verification seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-verification-seed
          path: ${{ runner.temp }}/dependency-verification-artifact/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1
