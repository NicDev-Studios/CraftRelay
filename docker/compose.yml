name: craftrelay-dev

services:
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      - craftrelay

  paper:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.20.6"
      ONLINE_MODE: "FALSE"
      COPY_CONFIG_DEST: "/data"
      MEMORY: "1G"
      MOTD: "CraftRelay Docker Paper"
      SPAWN_PROTECTION: "0"
    volumes:
      - paper-data:/data
      - ./paper/server-config:/config:ro
      - ../craftrelay-platform-paper/build/libs/craftrelay-platform-paper-0.1.0-SNAPSHOT.jar:/plugins/CraftRelay.jar:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - craftrelay

  paper-2:
    image: itzg/minecraft-server:java21
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.20.6"
      ONLINE_MODE: "FALSE"
      COPY_CONFIG_DEST: "/data"
      MEMORY: "1G"
      MOTD: "CraftRelay Docker Paper 2"
      SPAWN_PROTECTION: "0"
    volumes:
      - paper-2-data:/data
      - ./paper-2/server-config:/config:ro
      - ../craftrelay-platform-paper/build/libs/craftrelay-platform-paper-0.1.0-SNAPSHOT.jar:/plugins/CraftRelay.jar:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - craftrelay

  velocity:
    image: itzg/mc-proxy:java21
    environment:
      TYPE: "VELOCITY"
      VELOCITY_VERSION: "3.4.0-SNAPSHOT"
      MEMORY: "512M"
    ports:
      - "25565:25565"
    volumes:
      - velocity-data:/server
      - ./velocity/server-config:/config:ro
      - ../craftrelay-platform-velocity/build/libs/craftrelay-platform-velocity-0.1.0-SNAPSHOT.jar:/plugins/CraftRelay.jar:ro
    depends_on:
      redis:
        condition: service_healthy
      paper:
        condition: service_healthy
    networks:
      - craftrelay

  velocity-2:
    image: itzg/mc-proxy:java21
    environment:
      TYPE: "VELOCITY"
      VELOCITY_VERSION: "3.4.0-SNAPSHOT"
      MEMORY: "512M"
    ports:
      - "25566:25565"
    volumes:
      - velocity-2-data:/server
      - ./velocity-2/server-config:/config:ro
      - ../craftrelay-platform-velocity/build/libs/craftrelay-platform-velocity-0.1.0-SNAPSHOT.jar:/plugins/CraftRelay.jar:ro
    depends_on:
      redis:
        condition: service_healthy
      paper:
        condition: service_healthy
      paper-2:
        condition: service_healthy
    networks:
      - craftrelay

networks:
  craftrelay:
    driver: bridge

volumes:
  paper-data:
  paper-2-data:
  velocity-data:
  velocity-2-data:
