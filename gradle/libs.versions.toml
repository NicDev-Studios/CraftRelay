[versions]
paper = "1.20.6-R0.1-SNAPSHOT"
velocity = "3.4.0-SNAPSHOT"
jackson = "3.2.2"
lettuce = "7.6.0.RELEASE"
hikari = "7.1.0"
postgresql = "42.7.13"
mariadb = "3.5.10"
junit = "6.1.3"
testcontainers = "2.0.5"
slf4j = "2.0.18"
snakeyaml = "3.1.1"
shadow = "9.6.1"
maven-publish = "0.37.0"
japicmp = "0.4.6"
cyclonedx = "3.3.0"
license-report = "3.1.4"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-toxiproxy = { module = "org.testcontainers:testcontainers-toxiproxy", version.ref = "testcontainers" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
snakeyaml-engine = { module = "org.snakeyaml:snakeyaml-engine", version.ref = "snakeyaml" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
japicmp = { id = "me.champeau.gradle.japicmp", version.ref = "japicmp" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "license-report" }
